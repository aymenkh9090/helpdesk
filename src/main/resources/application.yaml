spring:
  application:
    name: helpdesk

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  # --- Configuration Spring Security Resource Server ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs

server:
       jwt:
         issuer-uri: ${KEYCLOAK_ISSUER_URI}
         jwk-set-uri: http://localhost:8080/realms/helpdesk-realm/protocol/openid-connect/certs

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
